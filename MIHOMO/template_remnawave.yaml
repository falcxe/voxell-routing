# ============================================================
# ШАБЛОН MIHOMO ДЛЯ REMNAWAVE ОТ VOXELL ROUTING
# ============================================================
# Набор правил Voxell Routing, адаптированный для Mihomo
#
# Режим:       rule
# Инбаунды:    TUN (system, strict-route), mixed-port 7890
#              Приватные и зарезервированные IP исключены из TUN и сниффера
# DNS:         fake-ip, Yandex DNS (direct) + Google DNS (proxy)
#              IPv6 в DNS отключён, весь IPv6-трафик ядра блокируется на уровне правил
#
# Группы прокси:
#   🛡️ VPN       — основная группа (по умолчанию)
#   ⚡️ Авто      — автовыбор по задержке (url-test, интервал 5 мин)
#   📺 Youtube   — отдельный выбор узла для YouTube
#   💬 Discord   — отдельный выбор узла для Discord / Vesktop
#   🎮 Игры      — игровые сервисы (Steam, Epic, Origin, Riot, EfT, FaceIT…)
#   🔓 Без VPN   — принудительный прямой доступ (DIRECT)
#   ⛔ Блок      — блокировка (REJECT)
#   ⏭️ Пропуск   — PASS (передать следующему правилу)
#
# Rule-sets (upstream geoip/geosite + пользовательские правила Voxell Routing):
#   • Реклама и слежка Windows              → REJECT-DROP
#   • Торренты (домены/клиенты)             → DIRECT
#   • Microsoft, Apple                      → DIRECT
#   • Российские домены (category-ru), ru-apps → DIRECT
#   • Twitch, Pinterest                     → DIRECT
#   • YouTube, Telegram, GitHub             → PROXY
#   • Игровые сервисы                       → 🎮 Игры
#   • Остальное                             → PROXY
#
# UDP-порт 443/853 (QUIC/DoQ) блокируется глобально.
#
# Разработка: ristavor
# Благодарности: hydraponique & fatyzzz
# Исходная Telegram-группа проекта: https://t.me/vpnrouting
#
# Будем благодарны любой поддержке:
# USDT TRC20 — TMu3N2ZjK5omJ7n3WAj5MNCSM5querBXsR
# ============================================================

mixed-port: 7890
mode: rule
log-level: silent
allow-lan: false
ipv6: true # для перехвата ipv6 трафика в ядро
unified-delay: true
tcp-concurrent: true
tun:
  enable: true
  stack: system
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
  strict-route: true
  route-exclude-address: # исключаем из перехвата приватные и зарезервированные IP-адреса
    - 224.0.0.0/3
    - 10.0.0.0/8
    - 127.0.0.0/8
    - 100.64.0.0/10
    - 172.16.0.0/12
    - 169.254.0.0/16
    - 192.168.0.0/16
    - 192.0.0.0/24
    - 192.0.2.0/24
    - 192.88.99.0/24
    - 198.51.100.0/24
    - 203.0.113.0/24
    - fc00::/7
    - ff00::/8
    - fe80::/10
    - ::/127
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip # fake-ip/redir-host
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - rule-set:private-domains # исключить из fake-ip приватные домены
  default-nameserver:
    - https://77.88.8.8/dns-query
    - https://8.8.8.8/dns-query
  proxy-server-nameserver:
    - https://77.88.8.8/dns-query
    - https://8.8.8.8/dns-query
  direct-nameserver:
    - https://77.88.8.8/dns-query
    - https://8.8.8.8/dns-query
  nameserver:
    - https://8.8.8.8/dns-query#PROXY
sniffer:
  enable: true
  override-destination: false
  parse-pure-ip: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
    TLS:
      ports:
        - 443
        - 8443
  skip-dst-address: # исключить из сниффера приватные и зарезервированные IP-адреса
    - 224.0.0.0/3
    - 10.0.0.0/8
    - 127.0.0.0/8
    - 100.64.0.0/10
    - 172.16.0.0/12
    - 198.18.0.0/15
    - 169.254.0.0/16
    - 192.168.0.0/16
    - 192.0.0.0/24
    - 192.0.2.0/24
    - 192.88.99.0/24
    - 198.51.100.0/24
    - 203.0.113.0/24
    - fc00::/7
    - ff00::/8
    - fe80::/10
    - ::/127
find-process-mode: strict
profile:
  store-selected: true
  store-fake-ip: true
proxies: # LEAVE THIS LINE!
proxy-groups:
  - name: 🛡️ VPN
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Hijacking.png
    type: select
    proxies:
      - ⚡️ Авто
    # LEAVE THIS LINE!
    url: https://www.gstatic.com/generate_204
  - name: 📺 Youtube
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/YouTube.png
    type: select
    remnawave:
      include-proxies: false
    include-all: true
    # filter: '🇫🇮 Finland' # Filter connections containing this value (hosts should be named like 🇫🇮 Finland1, 🇫🇮 Finland2, etc.)
    proxies:
      - 🛡️ VPN
      # Если хотите оставить на выбор только определенные узлы, воспользуйтесь filter
  - name: 💬 Discord.exe
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Discord.png
    type: select
    remnawave:
      include-proxies: false
    include-all: true
    proxies:
      - 🛡️ VPN
  - name: 🎮 Игры
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Game.png
    type: select
    remnawave:
      include-proxies: false
    include-all: true
    proxies:
      - 🔓 Без VPN
      - 🛡️ VPN
  - name: ⚡️ Авто
    type: url-test
    tolerance: 150
    url: https://www.gstatic.com/generate_204
    interval: 300
    # exclude-filter: прокси, которые хотите исключить
    remnawave:
      include-proxies: false
    include-all: true
    hidden: true
  - name: PROXY
    type: select
    hidden: true
    remnawave:
      include-proxies: false
    proxies:
      - 🛡️ VPN
  - name: 🔓 Без VPN
    type: select
    hidden: true
    remnawave:
      include-proxies: false
    proxies:
      - DIRECT
  - name: ⛔ Блок
    type: select
    hidden: true
    remnawave:
      include-proxies: false
    proxies:
      - REJECT
  - name: ⏭️ Пропуск
    type: select
    hidden: true
    remnawave:
      include-proxies: false
    proxies:
      - PASS
